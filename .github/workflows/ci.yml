name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # pnpm-lock.yaml is the lockfile that matches package.json; package-lock.json
      # is out of date (it lacks @base-ui/react and cmdk), so `npm ci` cannot be used.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # main already has 5 react-hooks/set-state-in-effect errors (time-picker, the
      # create steppers, ...), so lint is reported but does not block the other checks
      # until those are fixed. Remove continue-on-error then.
      - run: pnpm lint
        continue-on-error: true
      - run: pnpm typecheck
      - run: pnpm test
      # Payments are not configured here, so the build also checks that the app
      # compiles and prerenders without any secrets.
      - run: pnpm build
